# Kopieren nach /etc/mosquitto/conf.d/dashboard.conf
# Mosquitto 2.x (Bookworm) braucht einen expliziten Listener.

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd

# persistence ist in /etc/mosquitto/mosquitto.conf (Debian) bereits aktiv
# und wird fuer die retained-Nachrichten benoetigt.

# Optional: Zugriffsrechte pro Benutzer (siehe README).
# Aktivieren, nachdem /etc/mosquitto/acl angelegt wurde:
# acl_file /etc/mosquitto/acl
